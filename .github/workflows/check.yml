name: Build and test

on: [push, pull_request]

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y appstream desktop-file-utils just libudev-dev libwayland-dev libxkbcommon-dev pkg-config
          rustup toolchain install 1.99.0 --profile minimal --component clippy
      - name: Test
        run: cargo +1.99.0 test --locked
      - name: Lint
        run: cargo +1.99.0 clippy --locked --all-targets
      - name: Build and check installation
        run: |
          cargo +1.99.0 build --locked
          just rootdir="$RUNNER_TEMP/staging" bin-src=target/debug/cosmic-ext-calendar install
          test -x "$RUNNER_TEMP/staging/usr/bin/cosmic-ext-calendar"
          desktop-file-validate "$RUNNER_TEMP/staging/usr/share/applications/dev.edfloreshz.Calendar.desktop"
          desktop-file-validate "$RUNNER_TEMP/staging/etc/xdg/autostart/dev.edfloreshz.Calendar.Notifications.desktop"
          appstreamcli validate --no-net "$RUNNER_TEMP/staging/usr/share/appdata/dev.edfloreshz.Calendar.metainfo.xml"
